[package]
name = "maki-analyzer"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"
description = "GPL audio-analysis worker for Maki"

[dependencies]
anyhow = "1"
bliss-audio = { version = "0.11.4", default-features = false, features = ["analysis", "symphonia-all"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

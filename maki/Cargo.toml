[package]
name = "kyoku"
version = "0.0.1"
authors = ["Natalie Bridgers"]
edition = "2018"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls", "query", "form"] }

tracing = "0.1.44"
tracing-subscriber = "0.3.23"

dotenv = "0.15.0"

# scanning folders/files stuff
jwalk = "0.9"
crossbeam-channel = "0.5.17"
notify = "8.2.2"

# time stuff
time = { version = "0.3.55", features = ["serde"] }

# parsing metadata stuff
id3 = { version = "1.17.3", features = ["tokio"] }
metaflac = "0.2.8"

# lazy error handling
anyhow = "1.0.104"

# database things
sqlx = { version = "0.9", default-features = false, features = [
    "runtime-tokio",
    "tls-rustls-ring-webpki",
    "macros",
    "postgres",
    "time",
    "json",
    "migrate",
] }
# json/serialisation/parsing things
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
regex = "1.13.1"
base64 = "0.23.1"
blake3 = "1.8.7"
md-5 = "0.10.5"

# system info
heim = { git = "https://github.com/heim-rs/heim", features = [
    "memory",
    "host",
    "process",
] }
num_cpus = "1.17.0"

axum = { version = "0.8", features = ["tower-log", "macros", "ws"] }
futures = "0.3.34"
tower-http = { version = "0.7", features = ["fs", "cors"] }
tower = "0.5"
ring = "0.17.14"
image = "0.25.10"
sha3 = "0.10.8"
axum-macros = "0.5.1"
thiserror = "2.0.21"
tokio-util = "0.7.20"
unicode-normalization = "0.1.26"
mp3-duration = "0.1.10"
hound = "3.5.1"
josekit = "0.10.3"
itertools = "0.15.0"
oauth2 = { version = "5.0.0", default-features = false }
async-trait = "0.1.92"
clap = { version = "4.6.7", features = ["derive"] }
governor = "0.10.4"
urlencoding = "2.1.3"
utoipa = { version = "6", features = ["axum_extras", "time"] }
dashmap = "6.2.1"
rust-embed = "8.13.0"
mime_guess = "2.0.5"

# preferred async library
[dependencies.tokio]
version = "1.54.1"
features = ["full"]

[patch.crates-io]
darwin-libproc = { git = "https://github.com/Orycterope/darwin-libproc", branch = "dependencies_versions" }
